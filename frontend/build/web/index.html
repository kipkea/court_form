<html>

  <link rel="manifest" href="manifest.json">

<body>
  <script>
    // Capture sso_ticket immediately before Flutter router rewrites the URL
    try {
      var searchParams = new URLSearchParams(window.location.search);
      var t = searchParams.get('sso_ticket');
      if (t) {
        window.sessionStorage.setItem('court_sso_ticket', t);
      }
    } catch (e) {}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
